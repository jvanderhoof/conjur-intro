# A leader with one follower behind the follower load balancer -- the topology for
# reproducing anything about read scaling, follower authentication, or replication
# lag.
#
#   bin/env --plan environments/examples/leader-and-follower.yml
#   bin/env environments/examples/leader-and-follower.yml
#
# Asking for a follower is the whole request: bin/env provisions it and then
# configures its proxy trust, in that order, before any sample data is loaded, so
# there is no manual `--trust-follower-proxy` step afterwards. Proxy trust is what
# makes the follower believe the X-Forwarded-For its load balancer sets, so that
# audit records and IP-restricted host identities see the real client rather than
# the load balancer -- not a reachability step, but the kind of difference that
# decides whether an authorization repro behaves like the customer's.
#
# The sample data goes in last on purpose. `evoke seed follower` snapshots the
# leader's database, so a follower seeded after the secrets would serve them out of
# its own snapshot whether or not replication ever started; seeded first, the
# secrets can only reach the follower by replicating, and verification's
# retrieve-through-the-follower check means what it says.
#
# One follower is the ceiling. docker-compose.yml defines a single
# conjur-follower-1 and the follower load balancer's generated config has one
# backend server, so a second would need new compose services and a backend for
# each.
#
# This tier takes four more host ports: 80, 449 and 7001 for the load balancer, and
# 450 for the follower appliance itself. Preflight checks them all before pulling
# anything. CONJUR_FOLLOWER_PORT moves 450; the other three are fixed in
# docker-compose.yml.
#
# Followers can be combined with standbys and auto-failover -- add the `standbys`
# and `auto_failover` fields from highly-available.yml. `evoke configure follower`
# installs the failover rebaser, which repoints the follower at a newly promoted
# leader, and bin/env provisions the follower after enrolment so that the cluster
# exists by the time it is configured against it.
#
# Quote the version. Unquoted `13.5` is a YAML number, and unquoted `13.10`
# would silently become 13.1.
version: "5.0-stable"

leader:
  standbys: 0
  auto_failover: false

followers: 1

sample_data: true

# events: []   # reserved seam, deliberately unimplemented -- see the schema
